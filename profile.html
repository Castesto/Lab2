<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина</title>
    <link rel="stylesheet" href="styles/language.css">
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="styles/header.css">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/footer.css">
    <link rel="stylesheet" href="styles/productCatalog.css">
    <link rel="stylesheet" href="styles/animations.css">
    <link rel="stylesheet" href="styles/preloader.css">
    <link rel="stylesheet" href="styles/profile.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="page-catalog">

    <div id="preloader" class="preloader">
        <div class="spinner"></div>
    </div>

    <header></header>

    <main>



        <div id="reviewModal" class="modal-overlay">
            <div class="modal-content">
                <h3 data-i18n="profile.review_title">Оставить отзыв</h3>
                <textarea id="reviewText" placeholder="Напишите ваш отзыв..." maxlength="500"
                    data-i18n-placeholder="profile.review_placeholder"></textarea>
                <div class="modal-footer">
                    <span id="charCount">0 / 500</span>
                    <div class="modal-buttons">
                        <button id="submitReview" class="btn-submit"
                            data-i18n="profile.submit_review">Отправить</button>
                        <button id="closeReviewModal" class="btn-cancel" data-i18n="profile.cancel">Отмена</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="profile-edit-section">
            <h2 data-i18n="profile.edit_title">Редактирование профиля</h2>
            <form id="editProfileForm">
                <div class="form-row">
                    <label data-i18n="auth.nickname">Ник</label>
                    <input type="text" id="editNickname" name="nickName" required>
                    <div class="nickname-error-message error-message" style="display:none;"></div>
                </div>
                <div class="form-row">
                    <label data-i18n="auth.email">E-mail</label>
                    <input type="email" id="editEmail" name="email" required>
                    <div class="email-error-message error-message" style="display:none;"></div>
                </div>
                <div class="form-row">
                    <label data-i18n="auth.password">Новый пароль</label>
                    <input type="password" id="editPassword" name="password">
                </div>
                <div class="form-row">
                    <label data-i18n="auth.confirm_password">Подтвердите пароль</label>
                    <input type="password" id="editConfirmPassword">
                    <div class="password-error-message error-message" style="display:none;"></div>
                </div>
                <button type="submit" class="save-profile-btn box" data-i18n="profile.save">Сохранить</button>
                <div id="profileEditMessage" class="profile-message"></div>
            </form>
        </div>

        <div class="reviews">
            <div class="review">
                <div data-id="" class="photo">
                    <img src="" alt="">
                </div>
                <div class="name"></div>
                <button class="printReview"></button>
            </div>
        </div>
    </main>

    <footer></footer>
    <script src="/js/auth.js"></script>
    <script src="/js/include.js"></script>
    <script src="/js/profile.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
