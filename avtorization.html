<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Акромебель</title>
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="styles/header.css">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/footer.css">
    <link rel="stylesheet" href="styles/animations.css">
    <link rel="stylesheet" href="styles/registration.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <header></header>
    <main>
        <form action="" id="registrationform">
            <fieldset>
                <legend>Авторизация</legend>

              
                <div class="form-row">
                    <label>Ник</label>
                    <input type="text" id="nicknameInput" name="nickName" required>
                </div>
                    <div class="errorNickMessage"></div>
                <div class="form-row">
                    <label>Пароль</label>
                    <input type="password" id="passwordInput" name="password" required pattern=".{8,}" title="Минимум 8 символов" class="passwordInput"
                        required>
                </div>
                
            </fieldset>

          
            <fieldset class="registeredContainer">
                <button class="registered box">Авторизироваться</button>
            </fieldset>
        </form>
    </main>
    <footer></footer>
    <script src="/js/auth.js"></script>
    <script src="/js/include.js"></script>
    <script src="/js/avtorization.js"></script>
</body>
