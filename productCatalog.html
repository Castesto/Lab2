<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог</title>
    <link type="Image/x-icon" href="images/logo A.png" rel="icon">
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="styles/header.css">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/footer.css">
    <link rel="stylesheet" href="styles/preloader.css">
    <link rel="stylesheet" href="styles/productCatalog.css">
    <link rel="stylesheet" href="styles/animations.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="styles/modal.css">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="page-catalog">
    <div id="preloader" class="preloader">
        <div class="spinner"></div>
    </div>

    <header></header>

    <main>
    <div class="methods-panel">
        <div class="methods-grid method-buttons">
        <button class="method-btn box" id="filterLowPrice" data-i18n="catalog.filter">🔻 Фильтр: скидка <span class="badge-method">.filter()</span></button>
        <button class="method-btn box" id="filterSofa" data-i18n="catalog.sofa_check">🛋️ Eсть диваны дороже 10000 <span class="badge-method">.some()</span></button>
        <button class="method-btn box" id="mapIncreasePrice" data-i18n="catalog.price_increase">📈 +15% к цене (акция) <span class="badge-method">.map()</span></button>
        <button class="method-btn box" id="sortPriceAsc" data-i18n="catalog.price_asc">💰 Цена (возр.) <span class="badge-method">.sort()</span></button>
        <button class="method-btn box" id="sortSaleDesc" data-i18n="catalog.shift_first">🏷️ Удалить первый элемент <span class="badge-method">.shift()</span></button>
        <button class="method-btn box" id="reduceMaxPrice" data-i18n="catalog.max_price">🏆 Макс. цена <span class="badge-method">.reduce()</span></button>
        <button class="method-btn box" id="sliceFirstFour" data-i18n="catalog.first_four">📋 Первые 4 товара <span class="badge-method">.slice()</span></button>
        <button class="method-btn box" id="findChair" data-i18n="catalog.find_chair">🔍 Найти «Кресло» <span class="badge-method">.find()</span></button>
        <button class="method-btn box" id="concatNewItem" data-i18n="catalog.add_new">✨ Добавить новинку <span class="badge-method">.concat()</span></button>
        <button class="method-btn box" id="reverseOrder" data-i18n="catalog.reverse">🔄 Обратный порядок <span class="badge-method">.reverse()</span></button>
        <button class="method-btn reset-btn box" id="resetAll" data-i18n="catalog.reset">🏠 Показать все товары</button>
        </div>
    </div>



    <div class="filter-label" data-i18n="catalog.categories">Категории:</div>
        <div class="categories-filter">
            <label class="category-checkbox-wrapper">
                <input type="checkbox" value="bed" class="category-checkbox-input"> <span data-i18n="catalog.beds">Кровати</span>
            </label>
            <label class="category-checkbox-wrapper">
                <input type="checkbox" value="sofa" class="category-checkbox-input"> Диваны
            </label>
            <label class="category-checkbox-wrapper">
                <input type="checkbox" value="table" class="category-checkbox-input"> Столы
            </label>
            <label class="category-checkbox-wrapper">
                <input type="checkbox" value="chair" class="category-checkbox-input"> Кресла
            </label>
            <label class="category-checkbox-wrapper">
                <input type="checkbox" value="wardrobe" class="category-checkbox-input"> Шкафы
            </label>
            <label class="category-checkbox-wrapper">
                <input type="checkbox" value="cabinet" class="category-checkbox-input"> Тумбы
            </label>
            <label class="category-checkbox-wrapper">
                <input type="checkbox" value="other" class="category-checkbox-input"> <span data-i18n="catalog.other">Прочее</span>
            </label>
        </div>
        <div class="price-filter">
            <input type="number" id="minPrice" placeholder="Мин цена" data-i18n-placeholder="catalog.min_price">
            <input type="number" id="maxPrice" placeholder="Макс цена" data-i18n-placeholder="catalog.max_price">
        </div>

        <div class="sale-filter">
            <input type="number" id="minSale" placeholder="Мин цена (скидка)" data-i18n-placeholder="catalog.min_sale">
            <input type="number" id="maxSale" placeholder="Макс цена (скидка)" data-i18n-placeholder="catalog.max_sale">
        </div>
        <div class="sorting-container">
            <select id="sortingSelect" class="sorting-select">
                <option value="default" data-i18n="catalog.default_sort">По умолчанию</option>
                <option value="price-asc" data-i18n="catalog.price_asc_sort">Цена по возрастанию</option>
                <option value="price-desc" data-i18n="catalog.price_desc_sort">Цена по убыванию</option>
                <option value="sale-price-asc" data-i18n="catalog.sale_asc">Цена со скидкой по возрастанию</option>
                <option value="sale-price-desc" data-i18n="catalog.sale_desc">Цена со скидкой по убыванию</option>
                <option value="name-asc" data-i18n="catalog.name_asc">Название А-Я</option>
                <option value="name-desc" data-i18n="catalog.name_desc">Название Я-А</option>
            </select>
        </div>


        <div class="products">
            <div class="saleProductsText" data-i18n="catalog.all_products">
                ВСЕ ТОВАРЫ
            </div>
            <div class="productCards">
            </div>
        </div>
        <div id="pagination" class="pagination-container"></div>
    </main>


    <footer></footer>



    <script src="/js/auth.js"></script>
    <script src="/js/include.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/productCatalog.js"></script>

    <div id="productDetailModal" class="modal-overlay">
        <div class="modal-container" style="max-width: 600px;">
            <button class="modal-close">&times;</button>
            <div class="modal-title" id="detailTitle"></div>
            <div id="detailContent"></div>
        </div>
    </div>
</body>

</html>
