<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина</title>
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="styles/header.css">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/footer.css">
    <link rel="stylesheet" href="styles/productCatalog.css">
    <link rel="stylesheet" href="styles/animations.css">
    <link rel="stylesheet" href="styles/admin.css">
    <link rel="stylesheet" href="styles/preloader.css">
    <link rel="stylesheet" href="styles/modal.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>



<body class="page-catalog">
    <div id="preloader" class="preloader">
        <div class="spinner"></div>
    </div>

    <header id="header-placeholder"></header>

  <main>
    <div class="buttonsText">Кнопки действия</div>
    <div class="adminButtons">
        <button class="addProduct box" data-modal="addModal">Добавить товар</button>
        <button class="editProduct box" data-modal="editModal">Изменить товар</button>
        <button class="deleteProduct box" data-modal="deleteModal">Удалить товар</button>
        <button class="wathReviews box" data-modal="reviewsModal">Посмотреть отзывы</button>
    </div>

    <div id="addModal" class="modal-overlay">
        <div class="modal-container">
            <button class="modal-close">&times;</button>
            <div class="modal-title">Добавление товара</div>
            <form id="addProductForm">
                <div class="form-row"><label>Название</label><input type="text" id="nameInput" name="name" required></div>
                <div class="form-row"><label>Цена</label><input type="text" id="priceInput" name="price" pattern="\d*" required></div>
                <div class="form-row"><label>Цена со скидкой</label><input type="text" id="salePriceInput" name="sailPrice" pattern="\d*" required></div>
                <div class="form-row"><label>Рейтинг</label><input type="text" id="rateInput" name="rating" pattern="^(?:[0-4](?:\.\d+)?|5(?:\.0+)?)$" required></div>
                <div class="form-row"><label>Изображение</label><input type="file" id="imageInput" accept="image/*" required><input type="hidden" id="imagePathInput" name="image" value=""></div>
                <button class="registered box" type="submit">Добавить</button>
            </form>
        </div>
    </div>

    <div id="editModal" class="modal-overlay">
        <div class="modal-container">
            <button class="modal-close">&times;</button>
            <div class="modal-title">Изменение товара</div>
            <label>Поиск товара: <input type="text" class="searchForEdit"></label>
            <div class="searchResultBox"></div>
            <form id="editProductForm" style="display:none;">
                <legend class="editProductLegend">Внесение изменений: <span></span></legend>
                <div class="form-row"><label>Название</label><input type="text" id="nameEditInput" name="name" required></div>
                <div class="form-row"><label>Цена</label><input type="text" id="priceEditInput" name="price" pattern="\d*" required></div>
                <div class="form-row"><label>Цена со скидкой</label><input type="text" id="salePriceEditInput" name="sailPrice" pattern="\d*" required></div>
                <div class="form-row"><label>Рейтинг</label><input type="text" id="rateEditInput" name="rating" pattern="^(?:[0-4](?:\.\d+)?|5(?:\.0+)?)$" required></div>
                <div class="form-row"><label>Изображение</label><input type="file" id="imageEditInput" accept="image/*"><input type="hidden" id="imagePathEditInput" name="image" value=""></div>
                <button class="registered box" type="submit">Изменить</button>
            </form>
        </div>
    </div>

    <div id="deleteModal" class="modal-overlay">
        <div class="modal-container">
            <button class="modal-close">&times;</button>
            <div class="modal-title">Удаление товара</div>
            <label>Поиск товара: <input type="text" class="searchForDelete"></label>
            <div class="searchDeleteResultBox"></div>
            <button class="deleteProductButton box registered" style="display:none;">Удалить</button>
        </div>
    </div>

    <div id="reviewsModal" class="modal-overlay">
        <div class="modal-container">
            <button class="modal-close">&times;</button>
            <div class="modal-title">Просмотр отзывов</div>
            <div class="searchAndSelect">
                <label>Параметр поиска: <select id="searchParameterSelect"><option value="name">Название товара</option><option value="nickName" selected>Никнейм</option></select></label>
                <label>Поиск: <input type="text" class="searchReviewsByName"></label>
                <div class="reviewsContainer"></div>
            </div>
        </div>
    </div>
</main>

    <footer id="footer-placeholder"></footer>
    <script src="/js/auth.js"></script>
    <script src="/js/include.js"></script>
    <script src="/js/admin.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
