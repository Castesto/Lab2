<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>CatVogue — каталог кошачьих пород</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>

<header class="app-header">
  <div class="container">
    <div class="logo">
      <h1>🐱 CatVogue</h1>
      <p>энциклопедия кошачьих пород</p>
    </div>
  </div>
</header>

<main class="container">
  <div class="toolbar">
    <div class="search-group">
      <label><i class="fas fa-search"></i> Поиск по породе</label>
      <div class="search-wrapper">
        <input type="text" id="searchInput" placeholder="Например: Siamese, Maine Coon..." autofocus>
        <button id="clearSearchBtn" aria-label="Очистить"><i class="fas fa-times-circle"></i></button>
      </div>
    </div>
    <div class="filters">
      <div class="filter-select">
        <label>⚡ Энергия</label>
        <select id="energyFilter">
          <option value="any">Любая</option>
          <option value="1">1 (низкая)</option><option value="2">2</option>
          <option value="3">3 (средняя)</option><option value="4">4</option><option value="5">5 (высокая)</option>
        </select>
      </div>
      <div class="filter-select">
        <label>👶 Дружелюбие к детям</label>
        <select id="childFilter">
          <option value="any">Любое</option><option value="1">1</option><option value="2">2</option>
          <option value="3">3</option><option value="4">4</option><option value="5">5</option>
        </select>
      </div>
      <div class="filter-select">
        <label>🪶 Линька</label>
        <select id="sheddingFilter">
          <option value="any">Любая</option><option value="1">1 (минимальная)</option><option value="2">2</option>
          <option value="3">3 (средняя)</option><option value="4">4</option><option value="5">5 (интенсивная)</option>
        </select>
      </div>
    </div>
    <div class="breed-selector">
      <label>🎲 Порода для случайного фото</label>
      <select id="randomBreedSelect">
        <option value="random">🌀 Любая случайная порода</option>
      </select>
    </div>
    <button id="randomPhotoBtn" class="random-btn"><i class="fas fa-camera-retro"></i> Случайное фото</button>
  </div>

  <div id="cardsContainer" class="cards-grid">
    <div class="no-results" style="display: none;">Загрузка усатых...</div>
  </div>
</main>

<footer>
  <p>🐾 Проект «CatVogue» — данные от <a href="https://thecatapi.com" target="_blank" rel="noopener">The Cat API</a> · 
  <a href="https://github.com/your-cat-explorer" target="_blank">GitHub автора</a> · © 2025</p>
</footer>

<div id="lightbox" class="lightbox">
  <div class="lightbox-content">
    <img class="lightbox-img" id="lightboxImg" src="" alt="Увеличенное фото кошки">
    <button class="close-lightbox" id="closeLightboxBtn">✕</button>
  </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
