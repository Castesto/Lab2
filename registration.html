<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Акромебель</title>
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="styles/header.css">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/footer.css">
    <link rel="stylesheet" href="styles/animations.css">
    <link rel="stylesheet" href="styles/registration.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>
    <header></header>
    <main>
        <form action="" id="registrationform">
            <fieldset>
                <legend>Регистрация</legend>
                
                <div class="form-row">
                    <label>Фамилия</label>
                    <input type="text" required>
                </div>
                <div class="form-row">
                    <label>Имя</label>
                    <input type="text" id="nameInput" required>
                </div>
                <div class="form-row">
                    <label>Отчество</label>
                    <input type="text" required>
                </div>
                <div class="form-row">
                    <label>Ник</label>
                    <input type="text" id="nicknameInput" required>
                </div>
                 <div class="form-row">
                    <label>Пароль</label>
                    <input type="password" required>
                </div>
                <div class="form-row">
                    <label>Повторите пароль</label>
                    <input type="password" required>
                </div>
                <div class="form-row">
                    <label>E-mail</label>
                    <input type="email" required>
                </div>
                <div class="form-row">
                    <label>Номер</label>
                    <input type="email" required>
                </div>
            </fieldset>

            <fieldset class="generateButtons">
                <button type="button" class="generate-nickname box">Придумать никнейм</button>
                <button type="button" class="generate-password box">Сгенерировать пароль</button>
            </fieldset>

            <fieldset>
                <legend class="agreement">Соглашение</legend>
                <label><input type="checkbox" name="agreement"> Согласен с <a href="#">пользовательским соглашением</a></label>
            </fieldset>
        </form>
    </main>
    <footer></footer>
    <script src="/js/include.js"></script>
    <script src="/js/registration.js"></script>
</body>
