<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Акромебель</title>
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="styles/header.css">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/footer.css">
    <link rel="stylesheet" href="styles/animations.css">
    <link rel="stylesheet" href="styles/registration.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>
    <header></header>
    <main>
        <form action="" id="registrationform">
            <fieldset>
                <legend>Регистрация</legend>

                <div class="form-row">
                    <label>Фамилия</label>
                    <input type="text" id="lastNameInput" name="lastName" required>
                </div>
                <div class="form-row">
                    <label>Имя</label>
                    <input type="text" id="nameInput" name="firstName" required>
                </div>
                <div class="form-row">
                    <label>Отчество</label>
                    <input type="text" id="fatherNameInput" name="fatherName" required>
                </div>
                <div class="form-row">
                    <label>Дата рождения</label>
                    <input type="date" id="birthdate" name="dateBirthday" required>
                    <small id="dateError" style="color: red; display: none;"></small>
                </div>
                <div class="form-row">
                    <label>Ник</label>
                    <input type="text" id="nicknameInput" name="nickName" required>
                </div>
                    <div class="errorNickMessage"></div>
                <div class="form-row">
                    <label>Пароль</label>
                    <input type="password" id="passwordInput" name="password" required pattern=".{8,}" title="Минимум 8 символов" class="passwordInput"
                        required>
                </div>
                <div class="form-row">
                    <label>Повторите пароль</label>
                    <input type="password" class="secondPasswordInput"
                        oninput="this.setCustomValidity(this.value !== document.querySelector('.passwordInput').value ? 'Пароли не совпадают' : '')"
                        required>
                </div>
                <div class="form-row">
                    <label>E-mail</label>
                    <input type="email" id="emailInput" name="email" required>
                </div>
                <div class="form-row">
                    <label>Номер</label>
                    <input type="tel"
                        title="Номер должен начинаться с +375 и содержать 9 цифр после кода (всего 13 символов)"
                        pattern="\+375[0-9]{9}" id="numberInput" name="phoneNumber" required>
                </div>
            </fieldset>

            <fieldset class="generateButtons">
                <button type="button" class="generate-nickname box">Придумать никнейм</button>
                <button type="button" class="generate-password box">Сгенерировать пароль</button>
            </fieldset>
            <fieldset>
                <legend class="agreement">Соглашение</legend>
                <label><input type="checkbox" name="agreement" required> Согласен с <a href="#">пользовательским
                        соглашением</a></label>
            </fieldset>
            <fieldset class="registeredContainer">
                <button class="registered box">Зарегестрироваться</button>
            </fieldset>
        </form>
    </main>
    <footer></footer>
    <script src="/js/include.js"></script>
    <script src="/js/registration.js"></script>
</body>
